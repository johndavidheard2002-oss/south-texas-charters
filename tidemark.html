<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Tide Mark — Fishing Logbook</title>
  <meta name="description" content="Download Tide Mark Fishing Logbook on the App Store or Google Play. Log every catch in seconds with automatic tides, weather, and map pins." />
  <meta property="og:title" content="Tide Mark — Your Logbook, Your Spots" />
  <meta property="og:description" content="Log every catch in seconds with automatic tide height, incoming/outgoing water, and private map pins. Download on the App Store or Google Play." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://southtexascharters.com/tidemark" />
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var iosUrl = "https://apps.apple.com/us/app/tide-mark-fishing-logbook/id6808864529";
      var androidUrl = "https://play.google.com/store/apps/details?id=com.tidemark.logbook";
      if (/android/i.test(ua)) {
        window.location.replace(androidUrl);
      } else if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
        window.location.replace(iosUrl);
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #071925;
      color: #f4f8fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #0d2638;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    p {
      color: #b5cad8;
      font-size: 16px;
      line-height: 1.45;
      margin-bottom: 24px;
    }
    .btns {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: block;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      padding: 15px 20px;
      border-radius: 12px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-apple {
      background: #ffffff;
      color: #071925;
    }
    .btn-google {
      background: #18a999;
      color: #ffffff;
    }
    .sub {
      margin-top: 18px;
      font-size: 13px;
      color: #82a0b4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tide Mark — Fishing Logbook</h1>
    <p>Log every catch in seconds with automatic tides, incoming/outgoing water, and private map pins. Choose your store to download:</p>
    <div class="btns">
      <a class="btn btn-apple" href="https://apps.apple.com/us/app/tide-mark-fishing-logbook/id6808864529">Download on the App Store (iPhone / iPad)</a>
      <a class="btn btn-google" href="https://play.google.com/store/apps/details?id=com.tidemark.logbook">Get it on Google Play (Android)</a>
    </div>
    <p class="sub">1-month free trial · Cancel anytime</p>
  </div>
</body>
</html>
